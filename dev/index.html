<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsolete Part Matching — OPM (Dev)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/opm-shared.css?v=5" />
  <link rel="stylesheet" href="dev.css?v=3" />
</head>
<body class="opm-app" data-opm-page="dev-opm">
  <div class="opm-shell">
    <aside class="opm-sidebar" aria-label="Main navigation">
      <div class="opm-logo">
        <img
          class="opm-logo__img"
          src="../shared/assets/gems-setra-logo.png?v=2"
          alt="Gems Setra"
          width="168"
          height="48"
        />
      </div>
      <nav>
        <ul class="opm-nav">
          <li class="opm-nav__item">
            <a class="opm-nav__link is-active" href="index.html" aria-current="page">OPM</a>
          </li>
          <li class="opm-nav__item">
            <a class="opm-nav__link" href="opm-saved-drafts.html">Search History</a>
          </li>
          <li class="opm-nav__item">
            <a class="opm-nav__link" href="opm-series-coverage.html">Series Coverage</a>
          </li>
        </ul>
      </nav>
    </aside>

    <div class="opm-main">
      <header class="opm-header">
        <h1 class="opm-header__title">
          Obsolete Part Matching
          <span class="opm-env-badge opm-env-badge--dev">Dev</span>
        </h1>
      </header>

      <main class="opm-content">
        <section class="opm-panel" aria-label="Get recommendation">
          <p class="opm-panel__hint">
            Enter an obsolete part number. For example:
            <strong>N4100</strong>
          </p>
          <form id="opm-main-form" class="opm-search-row" action="#" method="post">
            <label for="opm-part-input" class="visually-hidden">Part number</label>
            <input
              id="opm-part-input"
              class="opm-input"
              type="text"
              name="partNumber"
              placeholder="e.g. N4100"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="opm-btn">Get Recommendation</button>
          </form>
          <p class="opm-panel__hint" style="margin-top: 12px;">
            <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer;">
              <input id="opm-include-obsolete" type="checkbox" name="includeObsolete" />
              <span>Include obsolete candidates</span>
            </label>
          </p>
        </section>

        <section
          id="opm-rec-panel"
          class="opm-rec-panel opm-rec-panel--hidden"
          aria-label="Recommendation results"
        >
          <div id="opm-results-loading" class="opm-rec-loading" hidden>
            <span class="opm-rec-loading__spinner" aria-hidden="true"></span>
            <span id="opm-results-loading-text">Finding replacements…</span>
          </div>
          <div id="opm-results-alert" class="opm-alert" hidden role="alert"></div>
          <div id="opm-results-root"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../shared/opm-config.js"></script>
  <script src="../shared/opm-recent-queries.js?v=5"></script>
  <script src="../shared/opm-partsmatch-client.js"></script>
  <script src="../shared/opm-partsmatch-graph.js?v=4"></script>
  <script src="../shared/opm-partsmatch-opm.js?v=7"></script>
</body>
</html>
