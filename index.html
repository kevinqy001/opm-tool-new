<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsolete Part Matching — OPM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="opm-shared.css" />
</head>
<body class="opm-app" data-opm-page="opm">
  <div class="opm-shell">
    <aside class="opm-sidebar" aria-label="Main navigation">
      <div class="opm-logo">
        <img
          class="opm-logo__img"
          src="assets/gems-setra-logo.png?v=2"
          alt="Gems Setra"
          width="168"
          height="48"
        />
      </div>
      <nav>
        <ul class="opm-nav">
          <li class="opm-nav__item">
            <a class="opm-nav__link is-active" href="index.html" aria-current="page">OPM</a>
          </li>
          <li class="opm-nav__item">
            <a class="opm-nav__link" href="opm-saved-drafts.html">Search History</a>
          </li>
          <li class="opm-nav__item">
            <a class="opm-nav__link" href="opm-series-coverage.html">Series Coverage</a>
          </li>
        </ul>
      </nav>
    </aside>

    <div class="opm-main">
      <header class="opm-header">
        <h1 class="opm-header__title">Obsolete Part Matching</h1>
        <div class="opm-header__contact">
          <span class="opm-header__phone-icon" aria-hidden="true">&#9742;</span>
          <span>Call us at +1-800-378-1600</span>
        </div>
      </header>

      <main class="opm-content">
        <section class="opm-panel" aria-label="Get recommendation">
          <p class="opm-panel__hint">
            Enter a part number or replacement request. Demo example that works on the live API:
            <strong>Need replacement for 20010001497ORF</strong>
          </p>
          <form id="opm-main-form" class="opm-search-row" action="#" method="post">
            <label for="opm-query-input" class="visually-hidden">Part number or search text</label>
            <textarea
              id="opm-query-input"
              class="opm-textarea"
              name="queryContent"
              placeholder="e.g. Need replacement for 20010001497ORF"
              rows="5"
            ></textarea>
            <button type="submit" class="opm-btn">Get Recommendation</button>
          </form>
        </section>

        <section
          id="opm-rec-panel"
          class="opm-rec-panel opm-rec-panel--hidden"
          aria-label="Recommendation results"
        >
          <div id="opm-results-loading" class="opm-rec-loading" hidden>
            <span class="opm-rec-loading__spinner" aria-hidden="true"></span>
            <span id="opm-results-loading-text">Generating recommendations… This may take 1–2 minutes.</span>
          </div>
          <div id="opm-results-alert" class="opm-alert" hidden role="alert"></div>
          <div id="opm-results-root"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="opm-config.js"></script>
  <script src="opm-recent-queries.js"></script>
  <script src="opm-api-client.js"></script>
  <script src="opm-data-store.js"></script>
  <script src="opm-page-bootstrap.js"></script>
  <script src="opm-opm.js"></script>
</body>
</html>
