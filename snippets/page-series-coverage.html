<!-- 页面 3：Series Coverage — 系列搜索 + 表格 + 下载 Excel -->
<section aria-label="Series coverage">
  <form class="opm-search-row" action="#" method="get" onsubmit="return false;">
    <label for="series-search" class="visually-hidden">Part number</label>
    <input
      id="series-search"
      class="opm-input"
      type="search"
      name="partNumber"
      placeholder="Filter part numbers in selected series…"
      autocomplete="off"
    />
    <button type="submit" class="opm-btn">Search</button>
  </form>

  <div class="opm-toolbar">
    <p class="opm-toolbar__hint">
      This button can be used to download the complete coverage list
    </p>
    <button type="button" class="opm-btn">Download Excel</button>
  </div>

  <div class="opm-table-wrap">
    <table class="opm-table">
      <thead>
        <tr>
          <th scope="col">Part Number</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- 数据行由后端或脚本填充 -->
      </tbody>
    </table>
  </div>
</section>
